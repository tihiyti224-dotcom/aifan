<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIFan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 p-0">
  <div class="flex flex-col h-screen w-full bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 text-white overflow-hidden font-sans">
    <!-- Header -->
    <header class="flex items-center justify-between px-6 py-4 border-b border-white/10 backdrop-blur-md bg-white/5">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/30">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight">AIFan</h1>
          <p class="text-xs text-white/50 flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            ออนไลน์
          </p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button class="p-2 rounded-lg hover:bg-white/10 transition-colors" title="ตั้งค่า">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white/70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </button>
        <button class="p-2 rounded-lg hover:bg-white/10 transition-colors" title="โปรไฟล์">
          <div class="w-8 h-8 rounded-full bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center text-sm font-bold">U</div>
        </button>
      </div>
    </header>

    <!-- Chat Area -->
    <main id="chat-area" class="flex-1 overflow-y-auto px-4 py-6 space-y-6 scroll-smooth">
      <div class="flex flex-col items-center justify-center py-10 text-center">
        <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center shadow-2xl shadow-cyan-500/20 mb-6 animate-bounce">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </div>
        <h2 class="text-3xl font-bold bg-gradient-to-r from-cyan-300 via-blue-300 to-indigo-300 bg-clip-text text-transparent mb-2">ยินดีต้อนรับสู่ AIFan</h2>
        <p class="text-white/50 max-w-md">เริ่มต้นสนทนากับ AI อัจฉริยะของคุณได้เลย ฉันพร้อมช่วยเหลือคุณในทุกเรื่อง</p>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-8 w-full max-w-2xl">
          <button onclick="quickSend('ช่วยเขียนอีเมลทางการหน่อย')" class="p-4 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 hover:border-white/20 transition-all text-left group">
            <div class="w-8 h-8 rounded-lg bg-blue-500/20 flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </div>
            <p class="text-sm font-medium text-white/90">เขียนอีเมล</p>
            <p class="text-xs text-white/40 mt-1">สร้างอีเมลทางการได้อย่างรวดเร็ว</p>
          </button>
          <button onclick="quickSend('ช่วยอธิบาย Machine Learning แบบเข้าใจง่าย')" class="p-4 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 hover:border-white/20 transition-all text-left group">
            <div class="w-8 h-8 rounded-lg bg-emerald-500/20 flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
              </svg>
            </div>
            <p class="text-sm font-medium text-white/90">อธิบายความรู้</p>
            <p class="text-xs text-white/40 mt-1">อธิบายหัวข้อซับซ้อนให้เข้าใจง่าย</p>
          </button>
          <button onclick="quickSend('ช่วยเขียนโค้ด Python สำหรับจัดการไฟล์ CSV')" class="p-4 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 hover:border-white/20 transition-all text-left group">
            <div class="w-8 h-8 rounded-lg bg-amber-500/20 flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
              </svg>
            </div>
            <p class="text-sm font-medium text-white/90">เขียนโค้ด</p>
            <p class="text-xs text-white/40 mt-1">สร้างโค้ดในภาษาต่างๆ</p>
          </button>
        </div>
      </div>
    </main>

    <!-- Input Area -->
    <footer class="px-4 pb-4 pt-2">
      <div class="max-w-3xl mx-auto">
        <div class="relative flex items-end gap-2 bg-white/5 border border-white/10 rounded-2xl p-3 backdrop-blur-md shadow-xl shadow-black/20">
          <button class="p-2 rounded-xl hover:bg-white/10 transition-colors flex-shrink-0" title="แนบไฟล์">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white/50" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
            </svg>
          </button>
          <textarea id="message-input" rows="1" placeholder="พิมพ์ข้อความของคุณ..." class="flex-1 bg-transparent text-white placeholder-white/30 resize-none outline-none py-2 max-h-32" oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
          <button id="send-btn" onclick="sendMessage()" class="p-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 transition-all shadow-lg shadow-cyan-500/30 flex-shrink-0 disabled:opacity-50 disabled:cursor-not-allowed">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            </svg>
          </button>
        </div>
        <p class="text-center text-xs text-white/20 mt-2">AIFan อาจให้ข้อมูลที่ไม่ถูกต้อง โปรดตรวจสอบข้อมูลสำคัญ</p>
      </div>
    </footer>
  </div>

  <script>
    const chatArea = document.getElementById('chat-area');
    const input = document.getElementById('message-input');
    let isTyping = false;

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 128) + 'px';
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function quickSend(text) {
      input.value = text;
      autoResize(input);
      sendMessage();
    }

    function createMessageBubble(text, isUser) {
      const wrapper = document.createElement('div');
      wrapper.className = `flex ${isUser ? 'justify-end' : 'justify-start'} animate-fade-in`;
      const bubble = document.createElement('div');
      bubble.className = `max-w-[80%] sm:max-w-[70%] rounded-2xl px-5 py-3.5 ${isUser ? 'bg-gradient-to-br from-cyan-600 to-blue-700 text-white shadow-lg shadow-cyan-500/20 rounded-br-md' : 'bg-white/10 border border-white/10 text-white/90 rounded-bl-md backdrop-blur-sm'}`;
      if (!isUser) {
        const avatarWrapper = document.createElement('div');
        avatarWrapper.className = 'flex items-start gap-3';
        const avatar = document.createElement('div');
        avatar.className = 'w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center flex-shrink-0 mt-0.5';
        avatar.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>';
        const content = document.createElement('div');
        content.innerHTML = `<p class="text-sm leading-relaxed">${text}</p>`;
        avatarWrapper.appendChild(avatar);
        avatarWrapper.appendChild(content);
        bubble.appendChild(avatarWrapper);
      } else {
        bubble.innerHTML = `<p class="text-sm leading-relaxed">${text}</p>`;
      }
      wrapper.appendChild(bubble);
      return wrapper;
    }

    function createTypingIndicator() {
      const wrapper = document.createElement('div');
      wrapper.className = 'flex justify-start';
      wrapper.id = 'typing-indicator';
      const bubble = document.createElement('div');
      bubble.className = 'bg-white/10 border border-white/10 rounded-2xl rounded-bl-md px-5 py-4 backdrop-blur-sm';
      const avatarWrapper = document.createElement('div');
      avatarWrapper.className = 'flex items-center gap-3';
      const avatar = document.createElement('div');
      avatar.className = 'w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center flex-shrink-0';
      avatar.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>';
      const dots = document.createElement('div');
      dots.className = 'flex items-center gap-1.5';
      dots.innerHTML = `<div class="w-2 h-2 rounded-full bg-white/50 animate-bounce" style="animation-delay: 0s"></div><div class="w-2 h-2 rounded-full bg-white/50 animate-bounce" style="animation-delay: 0.15s"></div><div class="w-2 h-2 rounded-full bg-white/50 animate-bounce" style="animation-delay: 0.3s"></div>`;
      avatarWrapper.appendChild(avatar);
      avatarWrapper.appendChild(dots);
      bubble.appendChild(avatarWrapper);
      wrapper.appendChild(bubble);
      return wrapper;
    }

    function scrollToBottom() {
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text || isTyping) return;
      const welcome = chatArea.querySelector('.flex-col.items-center');
      if (welcome) welcome.style.display = 'none';
      chatArea.appendChild(createMessageBubble(text, true));
      input.value = '';
      input.style.height = 'auto';
      scrollToBottom();
      isTyping = true;
      const typing = createTypingIndicator();
      chatArea.appendChild(typing);
      scrollToBottom();
      setTimeout(() => {
        typing.remove();
        isTyping = false;
        const responses = [
          "เข้าใจแล้วค่ะ/ครับ ฉันพร้อมช่วยเหลือคุณในเรื่องนี้ มีอะไรเพิ่มเติมที่อยากให้ช่วยอีกไหมคะ/ครับ?",
          "น่าสนใจมากเลยค่ะ/ครับ! ฉันสามารถช่วยคุณวิเคราะห์หรือขยายความเพิ่มเติมได้นะคะ/ครับ",
          "ขอบคุณที่แชร์ข้อมูลนี้ค่ะ/ครับ ฉันจะทำการประมวลผลและให้คำตอบที่ดีที่สุดแก่คุณ",
          "ได้เลยค่ะ/ครับ! ฉันพร้อมช่วยคุณทำงานนี้ให้สำเร็จ โปรดบอกรายละเอียดเพิ่มเติมได้เลย"
        ];
        const randomResponse = responses[Math.floor(Math.random() * responses.length)];
        chatArea.appendChild(createMessageBubble(randomResponse, false));
        scrollToBottom();
      }, 1500 + Math.random() * 1000);
    }
  </script>

  <style>
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fade-in 0.3s ease-out forwards;
    }
  </style>
</body>
</html>
